<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 22px; font-weight: 600; fill: #111827; }
    .group { font-size: 13px; font-weight: 600; fill: #374151; }
    .label { font-size: 14px; font-weight: 600; fill: #111827; }
    .sub { font-size: 11px; fill: #6b7280; }
    .arrow-label { font-size: 11px; fill: #4b5563; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a" />
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#ffffff" />
  <text x="48" y="48" class="title">联邦平台：场景控制面与隔离执行面</text>

  <rect x="40" y="112" width="200" height="180" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
  <text x="60" y="140" class="group">参与方</text>
  <rect x="68" y="166" width="144" height="46" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" />
  <text x="140" y="187" text-anchor="middle" class="label">Web / SDK</text>
  <text x="140" y="202" text-anchor="middle" class="sub">上传与选择输入</text>
  <rect x="68" y="226" width="144" height="46" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" />
  <text x="140" y="247" text-anchor="middle" class="label">Participant client</text>
  <text x="140" y="262" text-anchor="middle" class="sub">本地预处理与加密</text>

  <rect x="300" y="82" width="378" height="406" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4" />
  <text x="320" y="108" class="group">统一控制面</text>
  <rect x="330" y="132" width="318" height="64" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" />
  <text x="489" y="158" text-anchor="middle" class="label">Upload API + Manifest extractor</text>
  <text x="489" y="177" text-anchor="middle" class="sub">格式、哈希、架构、checkpoint、rank</text>
  <rect x="330" y="226" width="145" height="76" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5" />
  <text x="402" y="255" text-anchor="middle" class="label">Scenario registry</text>
  <text x="402" y="274" text-anchor="middle" class="sub">输入契约与 runner 版本</text>
  <rect x="503" y="226" width="145" height="76" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5" />
  <text x="575" y="255" text-anchor="middle" class="label">Agent preflight</text>
  <text x="575" y="274" text-anchor="middle" class="sub">规则解释与长尾分析</text>
  <rect x="330" y="348" width="318" height="82" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" />
  <text x="489" y="379" text-anchor="middle" class="label">Run orchestrator</text>
  <text x="489" y="399" text-anchor="middle" class="sub">生成 RunSpec、状态机、评测闸门</text>

  <rect x="730" y="226" width="142" height="116" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" />
  <text x="801" y="260" text-anchor="middle" class="label">Job queue</text>
  <text x="801" y="280" text-anchor="middle" class="sub">RunSpec</text>
  <text x="801" y="299" text-anchor="middle" class="sub">events</text>
  <text x="801" y="318" text-anchor="middle" class="sub">retries</text>

  <rect x="920" y="82" width="238" height="406" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4" />
  <text x="940" y="108" class="group">隔离执行面</text>
  <rect x="950" y="132" width="178" height="70" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
  <text x="1039" y="160" text-anchor="middle" class="label">Federation runner</text>
  <text x="1039" y="180" text-anchor="middle" class="sub">LoRA FedAvg container</text>
  <rect x="950" y="236" width="178" height="70" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
  <text x="1039" y="264" text-anchor="middle" class="label">Evaluation runner</text>
  <text x="1039" y="284" text-anchor="middle" class="sub">GPU benchmark container</text>
  <rect x="950" y="340" width="178" height="70" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" />
  <text x="1039" y="368" text-anchor="middle" class="label">Output collector</text>
  <text x="1039" y="388" text-anchor="middle" class="sub">日志、指标、候选产物</text>
  <text x="1039" y="448" text-anchor="middle" class="sub">短期凭据 · 只读输入 · 默认无外网</text>

  <rect x="300" y="552" width="378" height="100" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" />
  <text x="489" y="590" text-anchor="middle" class="label">Object store</text>
  <text x="489" y="612" text-anchor="middle" class="sub">staging inputs · run outputs · logs</text>
  <rect x="780" y="552" width="378" height="100" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" />
  <text x="969" y="590" text-anchor="middle" class="label">Artifact registry + lineage</text>
  <text x="969" y="612" text-anchor="middle" class="sub">不可变版本、评测报告、输入谱系</text>

  <path d="M 240 202 L 300 202 L 300 164 L 330 164" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />
  <rect x="255" y="177" width="60" height="18" rx="3" fill="#ffffff" opacity=".95" />
  <text x="285" y="190" text-anchor="middle" class="arrow-label">上传内容</text>
  <path d="M 489 196 L 489 210 L 402 210 L 402 226" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />
  <path d="M 489 196 L 489 210 L 575 210 L 575 226" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />
  <path d="M 402 302 L 402 324 L 454 324 L 454 348" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)" />
  <path d="M 575 302 L 575 324 L 524 324 L 524 348" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)" />
  <path d="M 648 389 L 702 389 L 702 284 L 730 284" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)" />
  <rect x="670" y="356" width="62" height="18" rx="3" fill="#ffffff" opacity=".95" />
  <text x="701" y="369" text-anchor="middle" class="arrow-label">提交任务</text>
  <path d="M 872 262 L 902 262 L 902 167 L 950 167" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)" />
  <path d="M 872 306 L 920 306 L 920 271 L 950 271" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)" />
  <path d="M 1039 202 L 1039 236" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />
  <path d="M 1039 306 L 1039 340" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />
  <path d="M 1039 410 L 1039 520 L 489 520 L 489 552" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />
  <rect x="733" y="494" width="72" height="18" rx="3" fill="#ffffff" opacity=".95" />
  <text x="769" y="507" text-anchor="middle" class="arrow-label">写入结果</text>
  <path d="M 678 602 L 780 602" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />
  <rect x="691" y="576" width="74" height="18" rx="3" fill="#ffffff" opacity=".95" />
  <text x="728" y="589" text-anchor="middle" class="arrow-label">评测通过</text>

  <g transform="translate(48, 684)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />
    <text x="42" y="4" class="sub">数据与产物</text>
    <line x1="150" y1="0" x2="180" y2="0" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)" />
    <text x="192" y="4" class="sub">控制与调度</text>
    <line x1="300" y1="0" x2="330" y2="0" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />
    <text x="342" y="4" class="sub">持久化与发布</text>
  </g>
</svg>
