<rect width="1600" height="980" fill="#ffffff"/>
<text x="40" y="46" font-size="24" font-weight="700" fill="#111827" text-anchor="start">FedAgent Studio · 联邦 Agent 平台整体架构</text>
<text x="40" y="72" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="start">通用平台：场景 → 任务类型 → 算法（插件）→ 参与方；各方只交换算法清单声明的内容，由平台把关；任务产出发布为应用。下半部分以 FoT 为例</text>
<rect x="40" y="92" width="1520" height="88" rx="12" ry="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="6,4"/>
<rect x="40" y="196" width="1520" height="104" rx="12" ry="12" fill="#f8fbff" stroke="#bfdbfe" stroke-width="1.2" stroke-dasharray="6,4"/>
<rect x="40" y="388" width="1520" height="128" rx="12" ry="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="6,4"/>
<rect x="40" y="534" width="1520" height="228" rx="12" ry="12" fill="#fffaf5" stroke="#fed7aa" stroke-width="1.2" stroke-dasharray="6,4"/>
<rect x="40" y="800" width="1520" height="104" rx="12" ry="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="56" y="112" font-size="13" font-weight="700" fill="#334155" text-anchor="start">使用者</text>
<text x="56" y="216" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="start">界面</text>
<text x="56" y="408" font-size="13" font-weight="700" fill="#374151" text-anchor="start">核心（不认识具体算法，只按插件的声明办事）</text>
<text x="56" y="554" font-size="13" font-weight="700" fill="#c2410c" text-anchor="start">示例：FoT 的一轮（横向联邦，目前登记的算法插件）</text>
<text x="56" y="820" font-size="13" font-weight="700" fill="#334155" text-anchor="start">基础设施</text>
