<text x="612.0" y="259.8" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">列表 · 控制台式新建</text>
<text x="612.0" y="275.2" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">概览 · 进度 · 产出 · 配置</text>
<rect x="808" y="226" width="356" height="58" rx="8" ry="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="986.0" y="244.2" font-size="13.5" font-weight="600" fill="#111827" text-anchor="middle">应用</text>
<text x="986.0" y="259.8" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">任务产出发布后的成果</text>
<text x="986.0" y="275.2" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">试用 · 内容 · 接入</text>
<rect x="1182" y="226" width="356" height="58" rx="8" ry="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="1360.0" y="244.2" font-size="13.5" font-weight="600" fill="#111827" text-anchor="middle">基础管理（点开展开）</text>
<text x="1360.0" y="259.8" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">参与方与数据：按场景分块，任务类型是一列</text>
<text x="1360.0" y="275.2" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">算法（每类留待接入的空位）· 模型接口</text>
<rect x="150" y="318" width="1300" height="50" rx="8" ry="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.2"/>
<text x="800.0" y="340.0" font-size="14.5" font-weight="600" fill="#111827" text-anchor="middle">后端 API（REST）</text>
<text x="800.0" y="356.5" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">界面、命令行 fedagent、参与方客户端 fedagent-client 共用一套接口，权限与审计一致</text>
<rect x="60" y="416" width="250" height="82" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="185.0" y="445.5" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">注册表</text>
<text x="185.0" y="462.0" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">发现并校验插件</text>
<text x="185.0" y="478.5" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">任务类型 · 判分 · 执行器 · 数据格式</text>
<rect x="326" y="416" width="250" height="82" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="451.0" y="445.5" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">任务编排</text>
<text x="451.0" y="462.0" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">按清单逐轮逐步推进</text>
<text x="451.0" y="478.5" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">工作单元检查点 · 暂停 / 续跑</text>
<rect x="592" y="416" width="420" height="82" rx="8" ry="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.2"/>
<text x="802" y="436" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">算法插件</text>
<rect x="606" y="446" width="124" height="26" rx="6" ry="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
<text x="668" y="463" font-size="11.5" font-weight="600" fill="#166534" text-anchor="middle">横向 · FoT</text>
<rect x="740" y="446" width="124" height="26" rx="6" ry="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/>
<text x="802" y="463" font-size="11.5" font-weight="600" fill="#6b7280" text-anchor="middle">纵向 · 待接入</text>
<rect x="874" y="446" width="124" height="26" rx="6" ry="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/>
<text x="936" y="463" font-size="11.5" font-weight="600" fill="#6b7280" text-anchor="middle">迁移 · 待接入</text>
<text x="802" y="489" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">清单 = 角色 + 步骤 + 交换通道 + 产出 + 评估 + 参数</text>
<rect x="1028" y="416" width="250" height="82" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="1153.0" y="445.5" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">评测与指标</text>
<text x="1153.0" y="462.0" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">判分在持有标注的一方执行</text>
<text x="1153.0" y="478.5" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">本地 vs 联邦 · 负迁移 · 用量</text>
<rect x="1294" y="416" width="246" height="82" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="1417.0" y="445.5" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">产出与应用</text>
<text x="1417.0" y="462.0" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">每轮一版产出 · 发布为应用</text>
<text x="1417.0" y="478.5" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">试用 · 导出 · API（插件实现）</text>
<rect x="60" y="566" width="640" height="184" rx="10" ry="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="76" y="586" font-size="12.5" font-weight="700" fill="#c2410c" text-anchor="start">参与方 × N（只读自己的数据集，读不到标注）</text>
<rect x="76" y="598" width="192" height="60" rx="8" ry="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
<text x="172.0" y="617.2" font-size="13.5" font-weight="600" fill="#111827" text-anchor="middle">① 解题</text>
<text x="172.0" y="632.8" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">带当前经验库作答</text>
<text x="172.0" y="648.2" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">第 1 轮没有经验库 = 本地基线</text>
<rect x="284" y="598" width="192" height="60" rx="8" ry="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
<text x="380.0" y="617.2" font-size="13.5" font-weight="600" fill="#111827" text-anchor="middle">② 反思</text>
<text x="380.0" y="632.8" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">回顾自己的解法</text>
<text x="380.0" y="648.2" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">找出有效和无效的步骤</text>
<rect x="492" y="598" width="192" height="60" rx="8" ry="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
<text x="588.0" y="617.2" font-size="13.5" font-weight="600" fill="#111827" text-anchor="middle">③ 提取经验</text>
<text x="588.0" y="632.8" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">可复用的做法与适用条件</text>
<text x="588.0" y="648.2" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">每条是一段文本（论文里的 trace）</text>
<rect x="76" y="670" width="296" height="64" rx="8" ry="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="224.0" y="690.8" font-size="12.5" font-weight="600" fill="#111827" text-anchor="middle">执行器：平台托管</text>
<text x="224.0" y="706.2" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">平台的任务进程执行这一方的步骤</text>
<text x="224.0" y="721.8" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">数据集在平台：公开数据、演示、验证</text>
<rect x="388" y="670" width="296" height="64" rx="8" ry="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="536.0" y="690.8" font-size="12.5" font-weight="600" fill="#111827" text-anchor="middle">执行器：本地客户端</text>
<text x="536.0" y="706.2" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">fedagent-client 执行同一个插件包</text>
<text x="536.0" y="721.8" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">数据和密钥留本地，上传前可审查</text>
<rect x="900" y="566" width="640" height="184" rx="10" ry="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="916" y="586" font-size="12.5" font-weight="700" fill="#c2410c" text-anchor="start">服务端（只读到收到的解题经验，读不到任何数据集）</text>
<rect x="916" y="598" width="192" height="60" rx="8" ry="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
<text x="1012.0" y="617.2" font-size="13.5" font-weight="600" fill="#111827" text-anchor="middle">④ 汇总</text>
<text x="1012.0" y="632.8" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">收集本轮所有参与方</text>
<text x="1012.0" y="648.2" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">上传的解题经验</text>
<rect x="1124" y="598" width="192" height="60" rx="8" ry="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
<text x="1220.0" y="617.2" font-size="13.5" font-weight="600" fill="#111827" text-anchor="middle">⑤ 归类</text>
<text x="1220.0" y="632.8" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">标出前置 / 互补 / 替代关系</text>
<text x="1220.0" y="648.2" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">每条经验恰好归入一类</text>
<rect x="1332" y="598" width="192" height="60" rx="8" ry="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
<text x="1428.0" y="617.2" font-size="13.5" font-weight="600" fill="#111827" text-anchor="middle">⑥ 生成经验库</text>
<text x="1428.0" y="632.8" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">合并上一版经验库</text>
<text x="1428.0" y="648.2" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">输出下一轮使用的经验列表</text>
<rect x="916" y="670" width="608" height="64" rx="8" ry="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
<text x="1220.0" y="698.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">产出：经验库（每轮一版）</text>
<text x="1220.0" y="714.5" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">下发给所有参与方，进入下一轮；任意一版可发布为应用，供试用、导出和 API 调用</text>
<rect x="60" y="842" width="820" height="50" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="470.0" y="863.8" font-size="13.5" font-weight="600" fill="#111827" text-anchor="middle">模型网关（OpenAI 兼容接口）</text>
<text x="470.0" y="879.8" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">DeepSeek、智谱、百炼、OpenRouter、自建 vLLM 都可接 · 限流、重试、调用账本 · 本地参与方用自己的模型</text>
<rect x="896" y="842" width="320" height="50" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="1056.0" y="863.8" font-size="13.5" font-weight="600" fill="#111827" text-anchor="middle">存储</text>
<text x="1056.0" y="879.8" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">SQLite + 数据目录（数据集、运行目录）</text>
<rect x="1232" y="842" width="308" height="50" rx="8" ry="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="1386.0" y="863.8" font-size="13.5" font-weight="600" fill="#111827" text-anchor="middle">算力</text>
<text x="1386.0" y="879.8" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">只调模型接口，不需要 GPU 和沙箱</text>
<rect x="782.7" y="384.5" width="38.7" height="18.5" rx="4" fill="#ffffff" opacity="0.96"/>
<text x="802" y="397" font-size="11.5" font-weight="500" fill="#2563eb" text-anchor="middle">REST</text>
<rect x="750.0" y="511.5" width="104.0" height="18.5" rx="4" fill="#ffffff" opacity="0.96"/>
<text x="802" y="524" font-size="11.5" font-weight="500" fill="#ea580c" text-anchor="middle">按清单编排每一步</text>
<rect x="753.8" y="607.5" width="92.5" height="18.5" rx="4" fill="#ffffff" opacity="0.96"/>
<text x="800" y="620" font-size="11.5" font-weight="500" fill="#16a34a" text-anchor="middle">只上传解题经验</text>
<rect x="765.2" y="679.5" width="69.5" height="18.5" rx="4" fill="#ffffff" opacity="0.96"/>
<text x="800" y="692" font-size="11.5" font-weight="500" fill="#7c3aed" text-anchor="middle">下发经验库</text>
<rect x="163.0" y="771.0" width="122.0" height="18.0" rx="4" fill="#ffffff" opacity="0.96"/>
<text x="224" y="783" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">模型调用（平台托管）</text>
