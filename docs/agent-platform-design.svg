<text x="238.0" y="157.5" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">选场景、任务类型、算法和参与方，看结果，发布应用</text>
<rect x="434" y="122" width="356" height="46" rx="8" ry="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="612.0" y="141.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">参与方</text>
<text x="612.0" y="157.5" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">持有数据集：平台托管，或在本地运行客户端</text>
<rect x="808" y="122" width="356" height="46" rx="8" ry="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="986.0" y="141.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">管理员</text>
<text x="986.0" y="157.5" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">参与方与数据、算法、模型接口</text>
<rect x="1182" y="122" width="356" height="46" rx="8" ry="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="1360.0" y="141.5" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">外部 Agent / 脚本</text>
<text x="1360.0" y="157.5" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">通过 API 和命令行操作平台</text>
<rect x="60" y="226" width="356" height="58" rx="8" ry="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="238.0" y="244.2" font-size="13.5" font-weight="600" fill="#111827" text-anchor="middle">首页</text>
<text x="238.0" y="259.8" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">横向 · 纵向 · 迁移三张场景卡片（带示意图）</text>
<text x="238.0" y="275.2" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="middle">点进去配置这个场景的联邦任务</text>
