[project]
name = "fedagent-evomedclaw"
version = "0.2.0"
description = "FedAgent Studio 的 EvoMedClaw 横向医疗过程经验插件"
requires-python = ">=3.12"
dependencies = ["fedagent-sdk>=0.2.4", "pyyaml>=6.0"]

[project.entry-points."fedagent.algorithms"]
evomedclaw = "fedagent_evomed:EvoMedClaw"

[project.entry-points."fedagent.task_types"]
medical-diagnosis = "fedagent_evomed.medical:MedicalDiagnosis"

[project.entry-points."fedagent.graders"]
diagnosis-exact = "fedagent_evomed.medical:DiagnosisExactGrader"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fedagent_evomed"]
