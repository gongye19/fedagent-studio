# FoT（Federation over Text，arXiv:2604.16778）：横向联邦。
# 各方解题、反思、提取解题经验上传；服务端把经验归类、汇总成经验库下发，下一轮各方带着经验库解题。
id: fot
version: 1.1.0
name: FoT
full_name: Federation over Text
summary: 各方上传解题经验，服务端汇总成共享的经验库
scenario: horizontal
accepts: [math-reasoning]
agent_supported: false
roles:
  participant: { label: 参与方, min: 2, evaluated: true }
rounds: { min: 2, max: 6, default: 3 }
channels:
  trace:
    label: 解题经验（文本）
    from: participant
    to: server
    kind: json
    per_item: 1.5      # 复现器实测：全部提取时每条样本约 1.5 条；按论文密度约 0.9 条
    tokens: 150
artifact: { kind: text-library, name: 经验库, unit: 条经验, to: [participant] }
evaluation: { step: solve, baseline: round-1 }
steps:
  - { id: solve, label: 解题, at: participant, per: item, model: true, result: metric, estimate: { seconds: 45, tokens: 7000 }, retries: 3 }
  - { id: reflect, label: 反思, at: participant, per: item, model: true, estimate: { seconds: 15, tokens: 3500 }, retries: 3 }
  - { id: extract, label: 提取经验, at: participant, per: item, model: true, sends: [trace], result: uploads, estimate: { seconds: 12, tokens: 2500 }, retries: 3 }
  - { id: collect, label: 汇总, at: server, reads: [trace], result: received, estimate: { seconds: 5 } }
  # 归类和生成经验库自己按"汇总重试上限"重试，所以平台不再重试
  - { id: profile, label: 归类, at: server, model: true, result: groups, estimate: { seconds: 90, tokens: 8000 }, retries: 0 }
  - { id: library, label: 生成经验库, at: server, model: true, publishes: true, result: output, estimate: { seconds: 90, tokens: 8000 }, retries: 0 }
params:
  - key: insightTarget
    label: 经验库条数
    help: 服务端每轮把各方的经验汇总成多少条。默认由服务端模型决定，和论文一致；也可以按上传条数计算，或固定条数做对比实验。
    kind: select
    options:
      - { value: paper-auto, label: 模型决定（默认） }
      - { value: author-formula, label: 按上传条数计算 }
      - { value: fixed-11, label: 固定 11 条 }
      - { value: fixed-37, label: 固定 37 条 }
    default: paper-auto
  - key: traceDensity
    label: 经验提取量
    help: 默认优先提取最有价值的解题方法；也可按复现校准，每条样本最多提取 1 条。
    kind: select
    options:
      - { value: native, label: 精选方法（默认） }
      - { value: paper-gemini, label: 每条样本 1 条 }
    default: native
  - key: maxTracesPerItem
    label: 每条样本最多上传
    help: 每题至多提取 3 条最有价值的解题经验，也可选择更低上限。
    kind: select-number
    options:
      - { value: null, label: 沿用默认上限（3 条） }
      - { value: 1, label: 1 条 }
      - { value: 2, label: 2 条 }
      - { value: 3, label: 3 条 }
    default: 3
  - key: aggregationRetries
    label: 汇总重试上限
    help: 服务端汇总的结果不合法时重试几次；超过上限后任务暂停，避免费用失控。
    kind: number
    min: 1
    max: 20
    unit: 次
    default: 5
source:
  paper: arXiv:2604.16778
  paper_url: https://arxiv.org/abs/2604.16778
  code: github.com/dixiyao/FoT
  code_url: https://github.com/dixiyao/FoT
  commit: b02753c1f7c0946cbec077e737a4acbcb90f9cc0
