[project]
name = "fedagent-fot"
version = "0.1.4"
description = "算法插件：FoT（Federation over Text，arXiv:2604.16778），横向联邦"
requires-python = ">=3.12"
dependencies = ["fedagent-sdk>=0.2.3"]

[project.entry-points."fedagent.algorithms"]
fot = "fedagent_fot:FoT"

[tool.uv.sources]
fedagent-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fedagent_fot"]
