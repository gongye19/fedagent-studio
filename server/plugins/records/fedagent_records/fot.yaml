id: fot-records
version: 1.0.0
name: FoT
full_name: FoT · 过程记录经验聚合
summary: 平台从已上传的问诊或解题过程提取文字经验，汇总为应用经验库
scenario: horizontal
accepts:
- math-records
- medical-records
agent_supported: false
roles:
  participant:
    label: 参与方
    min: 2
    evaluated: false
rounds:
  min: 1
  max: 1
  default: 1
channels:
  trace:
    label: 提取的文字经验
    from: participant
    to: server
    kind: json
    per_item: 1.5
    tokens: 150
artifact:
  kind: text-library
  name: 经验库
  unit: 条经验
  to:
  - participant
evaluation: null
steps:
- id: prepare
  label: 读取过程记录
  at: participant
  per: item
  retries: 0
- id: reflect
  label: 反思
  at: participant
  per: item
  model: true
  estimate:
    seconds: 15
    tokens: 3500
  retries: 3
- id: extract
  label: 提取经验
  at: participant
  per: item
  model: true
  sends:
  - trace
  result: uploads
  estimate:
    seconds: 12
    tokens: 2500
  retries: 3
- id: collect
  label: 汇总
  at: server
  reads:
  - trace
  result: received
  estimate:
    seconds: 5
- id: profile
  label: 归类
  at: server
  model: true
  result: groups
  estimate:
    seconds: 90
    tokens: 8000
  retries: 0
- id: library
  label: 生成经验库
  at: server
  model: true
  publishes: true
  result: output
  estimate:
    seconds: 90
    tokens: 8000
  retries: 0
params:
- key: insightTarget
  label: 经验库条数
  help: 服务端每轮把各方的经验汇总成多少条。默认由服务端模型决定，和论文一致；也可以按上传条数计算，或固定条数做对比实验。
  kind: select
  options:
  - value: paper-auto
    label: 模型决定（默认）
  - value: author-formula
    label: 按上传条数计算
  - value: fixed-11
    label: 固定 11 条
  - value: fixed-37
    label: 固定 37 条
  default: paper-auto
- key: maxTracesPerItem
  label: 每条样本最多上传
  help: 每题至多提取 3 条最有价值的解题经验，也可选择更低上限。
  kind: select-number
  options:
  - value: null
    label: 沿用默认上限（3 条）
  - value: 1
    label: 1 条
  - value: 2
    label: 2 条
  - value: 3
    label: 3 条
  default: 3
- key: aggregationRetries
  label: 汇总重试上限
  help: 服务端汇总的结果不合法时重试几次；超过上限后任务暂停，避免费用失控。
  kind: number
  min: 1
  max: 20
  unit: 次
  default: 5
source:
  paper: arXiv:2604.16778
  paper_url: https://arxiv.org/abs/2604.16778
  code: github.com/dixiyao/FoT
  code_url: https://github.com/dixiyao/FoT
  commit: b02753c1f7c0946cbec077e737a4acbcb90f9cc0
