[project]
name = "fedagent-records"
version = "0.1.0"
description = "过程记录校验、平台经验提取及应用"
requires-python = ">=3.12"
dependencies = ["fedagent-sdk>=0.2.9", "fedagent-fot", "fedagent-evomedclaw", "fedagent-math-reasoning"]

[project.entry-points."fedagent.algorithms"]
fot-records = "fedagent_records.fot:RecordFoT"
evomedclaw-records = "fedagent_records.evo:RecordEvo"

[project.entry-points."fedagent.task_types"]
math-records = "fedagent_records.records:MathRecords"
medical-records = "fedagent_records.records:MedicalRecords"

[tool.uv.sources]
fedagent-sdk = {workspace = true}
fedagent-fot = {workspace = true}
fedagent-evomedclaw = {workspace = true}
fedagent-math-reasoning = {workspace = true}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["fedagent_records"]
