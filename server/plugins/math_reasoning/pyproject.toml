[project]
name = "fedagent-math-reasoning"
version = "0.2.0"
description = "任务类型插件：数学推理（样本格式、检查规则、判分）"
requires-python = ">=3.12"
dependencies = ["fedagent-sdk>=0.2.0"]

[project.entry-points."fedagent.task_types"]
math-reasoning = "fedagent_math:MathReasoning"

[project.entry-points."fedagent.graders"]
math-answer = "fedagent_math:PaperCompatibleGrader"
math-answer-strict = "fedagent_math:StrictGrader"

[tool.uv.sources]
fedagent-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fedagent_math"]
