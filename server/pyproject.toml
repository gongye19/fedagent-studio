[project]
name = "fedagent"
version = "0.1.0"
description = "FedAgent Studio 后端：通用的联邦 Agent 平台"
requires-python = ">=3.12"
dependencies = [
  "fedagent-sdk>=0.2.3",
  "fedagent-fot",
  "fedagent-math-reasoning",
  "fedagent-evomedclaw",
  "fedagent-records",
  "fastapi>=0.142.2",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "cryptography>=42",
  "python-multipart>=0.0.9",
]

[project.scripts]
fedagent = "fedagent.cli:main"

[dependency-groups]
dev = [
  "fedagent-client",
  "pytest>=8",
  "ruff>=0.6",
  "pyright>=1.1.380",
]

[tool.uv.workspace]
members = ["sdk", "plugins/fot", "plugins/math_reasoning", "plugins/evomedclaw", "plugins/records", "client"]

[tool.uv.sources]
fedagent-sdk = { workspace = true }
fedagent-fot = { workspace = true }
fedagent-math-reasoning = { workspace = true }
fedagent-client = { workspace = true }
fedagent-evomedclaw = { workspace = true }
fedagent-records = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fedagent"]

[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = ["fedagent/migrations/versions", "plugins/evomedclaw/fedagent_evomed/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# 提示词逐字取自上游，长行和行尾空格都是原文
"plugins/fot/fedagent_fot/prompts.py" = ["E501", "W291"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.pyright]
include = ["fedagent", "sdk", "plugins", "client"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
exclude = ["plugins/evomedclaw/fedagent_evomed/vendor"]
