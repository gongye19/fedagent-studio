[project]
name = "fedagent-client"
version = "0.1.2"
description = "FedAgent Studio 参与方本地客户端：领取本方的工作单元，在本地执行，只提交声明可以离开的内容"
requires-python = ">=3.12"
dependencies = ["fedagent-sdk>=0.2.0", "httpx>=0.27"]

[project.scripts]
fedagent-client = "fedagent_client.cli:main"

[tool.uv.sources]
fedagent-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fedagent_client"]
